name: Scrape Austin events

on:
  schedule:
    # 06:00 America/Chicago, DST-safe. GitHub cron is UTC-only with no
    # timezone support, so we fire at BOTH candidate UTC hours and let the
    # "gate" job below run the scrape only when it's really 06:00 in Austin.
    - cron: "0 11 * * *"   # 06:00 CDT (summer, UTC-5)
    - cron: "0 12 * * *"   # 06:00 CST (winter, UTC-6)
  workflow_dispatch: {}    # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: scrape-austin
  cancel-in-progress: false

jobs:
  gate:
    # Scheduled triggers fire at both 11:00 and 12:00 UTC; this job lets the
    # scrape proceed only at 06:00 America/Chicago, so the single logical "6am"
    # run never drifts with daylight saving. Manual runs always proceed.
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - name: Only proceed at 06:00 America/Chicago
        id: check
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Manual/dispatch run — proceeding."
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HOUR=$(TZ=America/Chicago date +%H)
          echo "America/Chicago hour is $HOUR"
          if [ "$HOUR" = "06" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "Not 06:00 Central — skipping this trigger."
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

  scrape:
    needs: gate
    if: needs.gate.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper (Do512 + 365 Things Austin)
        env:
          RSS_BRIDGE_BASE: ${{ vars.RSS_BRIDGE_BASE }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
        run: python scripts/scrape_austin.py

      - name: Install Instagram posts dependencies
        run: pip install requests python-dateutil

      - name: Fetch Instagram posts via Apify + Gemini
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_POSTS_TASK_ID: ${{ vars.APIFY_ACTOR_TASK_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_instagram_posts.py

      - name: Commit discovered.json if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- public/discovered.json; then
            echo "No changes to public/discovered.json"
            exit 0
          fi
          git add public/discovered.json
          git commit -m "chore: refresh discovered events [skip ci]"
          git push origin HEAD:main
